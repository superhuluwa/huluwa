name: hongguo-native

services:
  android:
    build: ./android
    image: hongguo-android-runtime:14-amd64-64only
    platform: linux/amd64
    container_name: hongguo-android-native
    restart: unless-stopped
    privileged: false
    cgroup: private
    cap_add:
      - ALL
    cap_drop:
      - SYS_BOOT
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_TIME
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/binder:/dev/binder
      - /dev/hwbinder:/dev/hwbinder
      - /dev/vndbinder:/dev/vndbinder
      - /dev/kmsg:/dev/kmsg
      - /dev/fuse:/dev/fuse
    volumes:
      - android-data:/data
    cpus: '4.0'
    mem_limit: 4g
    shm_size: 512m
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=15
      - androidboot.redroid_gpu_mode=guest
      - androidboot.use_memfd=true
      - ro.secure=0
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(getprop sys.boot_completed)" = 1']
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12
    networks:
      native:
        aliases: [android]

  signer:
    build: ./signer
    image: hongguo-sign-server:2.1-amd64
    platform: linux/amd64
    container_name: hongguo-signer-native
    restart: unless-stopped
    depends_on:
      android:
        condition: service_healthy
    ports:
      - '${SIGN_BIND:-0.0.0.0}:${SIGN_PORT:-8901}:8901'
    volumes:
      - '${APK_DIR:-./apk}:/apk:ro'
    environment:
      ADB_TARGET: android:5555
      TARGET_PKG: com.phoenix.read
      APK_PATH: /apk/base.apk
      BOOT_TIMEOUT: '${BOOT_TIMEOUT:-300}'
      APP_WARMUP: '${APP_WARMUP:-30}'
      APP_START_MODE: '${APP_START_MODE:-provider}'
      PORT: '8901'
    cpus: '2.0'
    mem_limit: 1g
    networks: [native]

networks:
  native:
    name: hongguo-native
    external: true

volumes:
  android-data:
    name: hongguo-native-data
    external: true
