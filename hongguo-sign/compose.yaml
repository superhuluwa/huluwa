name: hongguo-native

services:
  hongguo:
    build:
      context: .
      dockerfile: single/Dockerfile
    image: hongguo-sign:single-amd64
    platform: linux/amd64
    container_name: hongguo-sign
    restart: unless-stopped
    stop_grace_period: 30s
    privileged: false
    cgroup: private
    cap_add:
      - ALL
    cap_drop:
      - SYS_BOOT
      - SYS_MODULE
      - SYS_RAWIO
      - SYS_TIME
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    devices:
      - /dev/binder:/dev/binder
      - /dev/hwbinder:/dev/hwbinder
      - /dev/vndbinder:/dev/vndbinder
      - /dev/kmsg:/dev/kmsg
      - /dev/fuse:/dev/fuse
    ports:
      - '${SIGN_BIND:-0.0.0.0}:${SIGN_PORT:-8901}:8901'
    volumes:
      - android-data:/data
    environment:
      PORT: '8901'
      TARGET_PKG: com.phoenix.read
      BOOT_TIMEOUT: '${BOOT_TIMEOUT:-300}'
      APP_WARMUP: '${APP_WARMUP:-30}'
      APP_START_MODE: '${APP_START_MODE:-provider}'
      SIGN_READY_TIMEOUT: '${SIGN_READY_TIMEOUT:-120}'
      STARTUP_TIMEOUT: '${STARTUP_TIMEOUT:-600}'
      RECOVERY_TIMEOUT: '${RECOVERY_TIMEOUT:-300}'
    cpus: '6.0'
    mem_limit: 5g
    shm_size: 512m

volumes:
  android-data:
    name: '${ANDROID_DATA_VOLUME:-hongguo-native-data}'
    external: true
