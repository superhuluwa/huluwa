<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>葫芦娃 Android UI · 三套落地方案</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="workbench">
<header class="workbench-head">
<div class="brand"><span class="brand-icon">葫</span><div><b>葫芦娃 Android UI</b><small>三套可落地界面方向</small></div></div>
<div class="head-note">真实 App 布局 · 本地交互原型</div>
</header>
<section class="controls">
<div class="control-group" aria-label="选择方案">
<span class="control-label">方案</span>
<button class="on" data-view="all">并排</button>
<button data-view="sea">澄海</button>
<button data-view="iron">玄铁</button>
<button data-view="peach">蜜桃</button>
</div>
<div class="control-group pages" aria-label="选择页面">
<button class="on" data-page="home">功能</button>
<button data-page="system">系统</button>
<button data-page="downloads">下载</button>
<button data-page="subscriptions">订阅</button>
<button data-page="mine">我的</button>
<button data-page="chat">会话</button>
</div>
<button class="empty-btn" data-empty>空状态</button>
</section>
<section class="phone-grid">
<article class="variant" data-variant="sea">
<header class="variant-meta"><div><b>01 · 澄海</b><span>清晰 · 友好 · Material 3</span></div><i class="swatch sea-swatch"></i></header>
<div class="device">
<div class="phone">
<div class="android-status"><span>9:41</span><span class="punch"></span><span class="status-icons">5G <b class="signal">▂▄▆</b> 80% <i class="battery"></i></span></div>
<div class="app sea" data-app="sea"></div>
<div class="gesture"></div>
</div>
</div>
<p class="variant-note">标准五标签导航，操作路径最短</p>
</article>
<article class="variant" data-variant="iron">
<header class="variant-meta"><div><b>02 · 玄铁</b><span>高效 · 深色 · 状态优先</span></div><i class="swatch iron-swatch"></i></header>
<div class="device">
<div class="phone">
<div class="android-status"><span>9:41</span><span class="punch"></span><span class="status-icons">5G <b class="signal">▂▄▆</b> 80% <i class="battery"></i></span></div>
<div class="app iron" data-app="iron"></div>
<div class="gesture"></div>
</div>
</div>
<p class="variant-note">紧凑信息层次，适合高频管理</p>
</article>
<article class="variant" data-variant="peach">
<header class="variant-meta"><div><b>03 · 蜜桃</b><span>轻松 · 内容 · 圆润动势</span></div><i class="swatch peach-swatch"></i></header>
<div class="device">
<div class="phone">
<div class="android-status"><span>9:41</span><span class="punch"></span><span class="status-icons">5G <b class="signal">▂▄▆</b> 80% <i class="battery"></i></span></div>
<div class="app peach" data-app="peach"></div>
<div class="gesture"></div>
</div>
</div>
<p class="variant-note">内容入口更突出，适合家庭娱乐</p>
</article>
</section>
<footer class="workbench-foot"><span>示例账号与任务数据，不连接业务服务器</span><span>点击手机中的导航、筛选和操作体验</span></footer>
</main>
<div class="modal-layer" data-modal></div>
<div class="toast" data-toast></div>
<script src="app.js"></script>
</body>
</html>
