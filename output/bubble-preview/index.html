<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>气泡预览</title>
<style>
/* 暗夜量子设计 Token（沿用参考项目 quantum-web 的视觉体系） */
:root {
    --bg: #0B0F19;
    --sider: #0E1422;
    --card: #141C2E;
    --card-2: #182238;
    --line: rgba(148, 163, 184, .12);
    --line-2: rgba(148, 163, 184, .20);
    --accent: #0EA5E9;
    --accent-2: #38BDF8;
    --accent-weak: rgba(14, 165, 233, .10);
    --text: #F8FAFC;
    --text-2: #94A3B8;
    --text-3: #64748B;
    --ok: #10B981;
    --warn: #F59E0B;
    --danger: #F43F5E;
    --radius: 12px;
    --glow: 0 0 0 1px rgba(14, 165, 233, .22), 0 0 20px rgba(14, 165, 233, .10);
}

html, body {
    -webkit-font-smoothing: antialiased;
}

.glass-card {
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(0, 0, 0, .40);
}

.filter-card {
    padding: 16px 18px;
    margin-bottom: 16px;
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 4px 20px rgba(0, 0, 0, .25);
}

.filter-card .n-form-item {
    margin-bottom: 0 !important;
}

.grid-bg {
    position: relative;
}

.grid-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: .35;
    mask-image: radial-gradient(1200px 800px at 50% 0%, #000 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(1200px 800px at 50% 0%, #000 30%, transparent 100%);
    pointer-events: none;
}

.page-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.page-title .sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-3);
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 999px;
}

.pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
}

.pill.ok { background: rgba(52, 211, 153, .12); color: var(--ok); }
.pill.off { background: rgba(148, 163, 184, .12); color: var(--text-2); }
.pill.warn { background: rgba(251, 191, 36, .12); color: var(--warn); }
.pill.danger { background: rgba(248, 113, 113, .12); color: var(--danger); }

.mono {
    font-family: Consolas, "Segoe UI", monospace;
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--text-2);
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, .25); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, .4); }

.stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
}

.stat-card {
    padding: 18px;
    background: linear-gradient(180deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: var(--radius);
}

.stat-card .stat-label {
    color: var(--text-2);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.stat-card .stat-value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 10px;
    font-variant-numeric: tabular-nums;
}

.stat-card .stat-foot {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-3);
}

/* ==========================================================================
   移动端通用适配（<= 900px）
   仅作用于窄屏：桌面端样式与布局完全不变。
   ========================================================================== */

/* 弹窗（n-modal preset="card"）在窄屏占满可用宽度，内部留白同步收紧 */

html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
.chat-room { background: var(--bg); }
.message-stream { padding: 14px 14px 4px; }
.stream-content { display: flex; flex-direction: column; }
.rich-text { font-size: 15px; line-height: 1.58; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
.rich-text a { color: var(--accent); text-decoration: underline; word-break: break-all; }

.message-row {
    display: flex;
    /* 头像与气泡的水平间距由消息中心统一下发（左右两侧一致） */
    gap: var(--chat-avatar-gap, 10px);
    margin-bottom: 8px;
    align-items: flex-start;
    /* 行本身不许被子元素（超宽视频/封面）撑破，否则头像列与右侧留白会被挤掉 */
    min-width: 0;
    /* 极窄屏（如 320px）下长内容也不能把行撑出聊天区 */
    max-width: 100%;
    box-sizing: border-box;
    /* 左右头像列总占宽 = 2 × 头像(38px) + 2 × 间距(10px)；
       气泡可用宽度 = 100% − 这个值，保证长消息不会伸进对侧头像列。 */
    --chat-rail-both: 96px;
}

.message-row.mine {
    flex-direction: row-reverse;
}

/* 发送状态位（在气泡左侧）：pending 转圈 / failed 感叹号点击重发 */
.msg-status {
    flex: none;
    margin-top: 11px;
    font-size: 13px;
    color: var(--text-3);
}

.msg-status.failed {
    border: 0;
    padding: 0;
    background: none;
    color: #F43F5E;
    cursor: pointer;
    font-size: 15px;
}

.msg-status.failed:hover {
    opacity: .8;
}

.avatar {
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
}

.avatar.bot {
    background: linear-gradient(135deg, var(--accent), #6366F1);
    color: #04121B;
    font-size: 16px;
}

.avatar.bot.movie {
    background: linear-gradient(135deg, #6366F1, #A855F7);
    color: #F8FAFC;
    font-size: 15px;
}

.avatar.bot.dytt {
    background: linear-gradient(135deg, #10B981, #06B6D4);
    color: #04121B;
    font-size: 15px;
}

.avatar.bot.magnet {
    background: linear-gradient(135deg, #F59E0B, #EF4444);
    color: #1B1206;
    font-size: 14px;
}

.avatar.bot.video {
    background: linear-gradient(135deg, #06B6D4, #3B82F6);
    color: #F8FAFC;
    font-size: 15px;
}

.avatar.bot.xunlei {
    background: linear-gradient(135deg, #00C6FB, #005BEA);
    color: #04121B;
    font-size: 15px;
}

.avatar.mine {
    background: rgba(99, 102, 241, .20);
    color: #C7D2FE;
    font-weight: 600;
}

.bubble {
    position: relative;
    /* 项目没有全局 border-box：少了它 max-width 只算内容宽，
       左右内边距会额外多占 20~26px，长消息气泡就会越进对侧头像列。 */
    box-sizing: border-box;
    /* 兜底：老 WebView 不认 min()（表现为整条 max-width 失效、气泡按内容撑开）。
       calc + var 在该内核可用，扣除左右头像列后气泡在任何屏宽都不会越界。 */
    max-width: calc(100% - var(--chat-rail-both, 96px));
    /* 现代内核：再取「68% / 720px」的更严上限 */
    max-width: min(68%, calc(100% - var(--chat-rail-both, 96px)), 720px);
    padding: 9px 12px;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    background: var(--bubble-bot, #1E293B);
    /* 允许在 flex 行内收缩到 max-width 以下：
       没有这个约束时，无空格长串（磁力 / 长 URL）会把气泡按内容宽撑开，
       越过右侧留白甚至压到对侧头像列。 */
    min-width: 0;
}

/* 封面气泡：纯图（无配文）仍是一张窄图卡，宽度跟着图片走（border-box 见 .bubble） */
.bubble.is-cover {
    padding: 6px;
    max-width: calc(100% - var(--chat-rail-both, 96px));
    max-width: min(46%, calc(100% - var(--chat-rail-both, 96px)), 320px);
}

/* 带配文的卡片（影视卡片等）：卡片宽度不再跟着图片走——配文与操作条要撑满到右侧头像栏前，
   图片单独缩到原来的约 2/3（见 .is-cover-wide .cover），所以卡片更宽、里面的图更小。 */
.bubble.is-cover.is-cover-wide {
    /* 卡片宽度只受「右侧头像栏」约束，不再套用普通气泡的 68% / 74% 上限 */
    width: calc(100% - var(--chat-rail-both, 96px));
    width: min(calc(100% - var(--chat-rail-both, 96px)), 720px);
    max-width: 100%;
}

/* 视频气泡：播放器要够宽（320px 播放区），但比整块消息流窄（border-box 见 .bubble） */
.bubble.is-video {
    padding: 6px;
    max-width: calc(100% - var(--chat-rail-both, 96px));
    max-width: min(62%, calc(100% - var(--chat-rail-both, 96px)), 360px);
}

.message-row.mine .bubble {
    background: var(--bubble-me, #0C4A6E);
    border-bottom-left-radius: 16px;
    border-bottom-right-radius: 4px;
}

.bubble.is-error {
    border: 1px solid rgba(244, 63, 94, .45);
}

.bubble-tools {
    position: absolute;
    top: -12px;
    right: 8px;
    display: none;
    gap: 2px;
    padding: 2px;
    border-radius: 8px;
    background: var(--card);
    border: 1px solid var(--line-2);
    box-shadow: 0 6px 20px rgba(0, 0, 0, .45);
    z-index: 2;
}

.message-row.mine .bubble-tools {
    right: auto;
    left: 8px;
}

.bubble:hover .bubble-tools {
    display: flex;
}

.tool {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-2);
    cursor: pointer;
    font-size: 12px;
}

.tool:hover {
    background: rgba(148, 163, 184, .14);
    color: var(--text);
}

.bubble-content {
    font-size: 14px;
    /* 正文容器同样允许收缩，把宽度约束传给 RichText */
    min-width: 0;
    max-width: 100%;
}

.cover {
    display: block;
    width: 100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 11px;
    cursor: zoom-in;
    background: rgba(148, 163, 184, .08);
}

.cover-fallback {
    width: 100%;
    height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 11px;
    background: rgba(148, 163, 184, .08);
    color: var(--text-3);
    font-size: 12.5px;
}

/* 铺宽卡片：封面（含加载失败占位）高宽同步缩到原来的约 2/3。
   旧卡片宽 = min(46% / 62%, 扣除头像栏, 320px / 300px)，减去左右 6px 内边距；
   缩到 2/3 后窄屏约等于卡片宽的 55%，宽屏约 192px 封顶，单独封顶避免卡片变宽后图片跟着变大。 */
.bubble.is-cover-wide .cover,
.bubble.is-cover-wide .cover-fallback {
    width: 55%;
    width: min(55%, 192px);
}

.cover-caption {
    padding: 8px 6px 4px;
    font-size: 13px;
}

/* 「查看磁力」按钮：与订阅按钮同排，仅影视卡片出现 */
.magnet-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid rgba(96, 165, 250, .4);
    background: rgba(96, 165, 250, .10);
    color: var(--accent);
    font-family: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
}

.magnet-btn:hover:not(:disabled) {
    background: rgba(96, 165, 250, .18);
    border-color: rgba(96, 165, 250, .6);
}

.magnet-btn:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* 影视卡片的订阅操作条：与配文同色系，点按后切换成「已订阅」静止态 */
.movie-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 4px;
    flex-wrap: wrap;
}

.subscribe-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(99, 102, 241, .55);
    background: rgba(99, 102, 241, .16);
    color: #C7D2FE;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
}

.subscribe-btn:hover:not(:disabled) {
    background: rgba(99, 102, 241, .28);
    border-color: rgba(129, 140, 248, .8);
    color: #E0E7FF;
}

.subscribe-btn.subscribed,
.subscribe-btn:disabled {
    cursor: default;
    border-color: rgba(74, 222, 128, .45);
    background: rgba(34, 197, 94, .14);
    color: #86EFAC;
}

.subscribe-btn.busy {
    opacity: .75;
}

.subscribe-tip {
    font-size: 11.5px;
    color: var(--text-3);
}

/* ==========================================================================
   手机端：气泡更宽、字号更大，复制工具条由「长按」唤出（触屏无 hover）
   ========================================================================== */
@media (max-width: 900px) {
    .message-row {
        margin-bottom: 10px;
    }

    .avatar {
        width: 36px;
        height: 36px;
    }

    .message-row {
        /* 手机端头像 36px + 间距 10px，左右两列合计 92px */
        --chat-rail-both: 92px;
    }

    .bubble {
        /* 兜底：老 WebView 不认 min() 时用 calc 扣除左右头像列，任何屏宽都不越界 */
        max-width: calc(100% - var(--chat-rail-both, 92px));
        /* 现代内核：取「74% / 扣除头像列 / 720px」的最严值 */
        max-width: min(74%, calc(100% - var(--chat-rail-both, 92px)), 720px);
        padding: 10px 13px;
        border-radius: 17px;
    }

    /* 纯图卡：手机端回到 300px 上限；带配文的铺宽卡片由 .is-cover-wide 接管，不受这条影响 */
    .bubble.is-cover {
        max-width: calc(100% - var(--chat-rail-both, 92px));
        max-width: min(62%, calc(100% - var(--chat-rail-both, 92px)), 300px);
    }

    /* 视频气泡：与普通气泡同一套上限，卡片不能一路顶到对侧头像列 */
    .bubble.is-video {
        max-width: calc(100% - var(--chat-rail-both, 92px));
        max-width: min(74%, calc(100% - var(--chat-rail-both, 92px)), 360px);
    }

    .bubble-content {
        font-size: 15px;
    }

    .bubble.hold-open .bubble-tools {
        display: flex;
    }

    .tool {
        width: 30px;
        height: 30px;
        font-size: 13px;
    }

    .bubble-tools {
        top: -14px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, .55);
    }

    .subscribe-btn {
        padding: 7px 14px;
        font-size: 13px;
    }
}

</style></head>
<body>
<div class="chat-room"><div class="message-stream"><div class="stream-content">
  <!-- 旧样式对照（把卡片宽度恢复为改动前的上限） -->
  <div class="message-row" data-case="old">
