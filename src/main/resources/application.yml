server:
  port: 8089
  address: 0.0.0.0

spring:
  application:
    name: huluwa-console
  datasource:
    url: jdbc:sqlite:${huluwa.data-dir:./data}/huluwa.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      pool-name: huluwa-pool
      connection-init-sql: PRAGMA foreign_keys = ON
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true

huluwa:
  data-dir: ./data
  token:
    # 留空则首次启动自动生成并持久化到数据库
    secret: ''
    expire-hours: 72
  frp:
    # 预留：frpc 可执行文件路径，后续接入进程管理时使用
    binary: ''
  docker:
    # 兼容历史配置；当前使用 docker-java SDK 直连守护进程，不再调用 docker CLI
    binary: ''
    # 守护进程地址：unix:///var/run/docker.sock（本机 socket）或 tcp://host:2375/2376（远程）
    # 留空则回退 DOCKER_HOST 环境变量 / 系统默认 socket
    host: ''
    # API 版本，留空时由应用调用守护进程 /version 自动协商，兼容 CentOS 旧版 Docker
    api-version: ''
    # 连接 / 响应超时（秒）；旧版 CentOS 低配机器可适当调大
    connection-timeout-seconds: 10
    response-timeout-seconds: 300

logging:
  level:
    root: INFO
    com.huluwa.console: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"