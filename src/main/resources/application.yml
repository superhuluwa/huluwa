server:
  port: 8000
  address: 0.0.0.0
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types: text/html,text/plain,text/css,text/javascript,application/javascript,application/json,image/svg+xml

spring:
  application:
    name: huluwa-console
  datasource:
    url: jdbc:sqlite:${huluwa.data-dir:./data}/huluwa.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      pool-name: huluwa-pool
      # WAL + busy_timeout：聊天异步 worker 落消息、订阅巡检读、WS 提交写三方并发时的防护
      connection-init-sql: PRAGMA foreign_keys = ON; PRAGMA busy_timeout = 5000; PRAGMA journal_mode = WAL
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true

huluwa:
  data-dir: ./data
  # 红果 TV 私人自用客户端的只读访问密钥；需与 APK 内置值一致。
  tv:
    access-key: ${HULUWA_TV_ACCESS_KEY:hongguotv-private-2026}
  terminalbuddy-public:
    # 只开放 TerminalBuddy 构建、日志和下载，不签发后台登录令牌。
    enabled: ${TERMINALBUDDY_PUBLIC_ENABLED:true}
  android-build:
    enabled: ${HULUWA_ANDROID_BUILD_ENABLED:false}
    directory: ${HULUWA_ANDROID_BUILD_DIR:/app/android-build}
    timeout-seconds: ${HULUWA_ANDROID_TIMEOUT_SECONDS:1800}
    retention: ${HULUWA_ANDROID_RETENTION:10}
  hls:
    # 与迅雷、qBittorrent 共用下载根目录，文件直接归档到剧名目录。
    media-root: ${HULUWA_HLS_MEDIA_ROOT:/vol1/1000/downloads}
    # 容器可写层内的私有目录，不绑定宿主机、不声明 Docker volume。
    work-root: ${HULUWA_HLS_WORK_ROOT:/app/.huluwa-work}
    # 空闲时每小时清理，日志至少保留 1 天；删除容器时工作区一起删除。
    log-retention-days: ${HULUWA_HLS_LOG_RETENTION_DAYS:7}
    # 只用于读取旧版本媒体文件和日志。
    legacy-media-root: ${HULUWA_HLS_LEGACY_MEDIA_ROOT:/media}
    binary: ${HULUWA_HLS_BINARY:/usr/local/bin/N_m3u8DL-RE}
    ffmpeg: ${HULUWA_HLS_FFMPEG:/usr/bin/ffmpeg}
    ffprobe: ${HULUWA_HLS_FFPROBE:/usr/bin/ffprobe}
  movie:
    # 搜索暂无资源时的监听间隔，由后端执行；命中后发送系统通知并结束。
    search-watch-interval-minutes: 30
    # 页面详情短期复用；巡检绕过已完成缓存，同 URL 的进行中请求仍会合并。
    detail-cache-seconds: 60
    detail-cache-max-entries: 128
  token:
    # 留空则首次启动自动生成并持久化到数据库
    secret: ''
    expire-hours: 72
  source:
    # 书源接口的对外地址（如 http://taihe.678120.cn:8086）。
    # 留空时按请求的 Host / X-Forwarded-* 头推断；反向代理改写 Host 时请显式配置。
    public-url: ''
  frp:
    # frpc 容器名：状态查询、热加载与重启都作用于它（docker restart frpc）
    container: frpc
    # frpc 容器内的可执行文件与配置路径（在其内部执行 verify / reload）
    binary: frpc
    container-config-path: /etc/frp/frpc.ini
    # huluwa-console 容器内可见的配置文件路径：由宿主机 /root/frp 目录绑定挂载而来
    config-path: /app/frp/frpc.ini
    # 宿主机上的真实路径，仅用于界面展示
    host-path: /root/frp/frpc.ini
  docker:
    # 兼容历史配置；当前使用 docker-java SDK 直连守护进程，不再调用 docker CLI
    binary: ''
    # 守护进程地址：留空则回退 DOCKER_HOST 环境变量 / 系统默认 socket。
    # compose 部署已注入 DOCKER_HOST=unix:///var/run/docker.sock；
    # 远程可填 tcp://host:2375（或 2376 + TLS）。
    host: ''
    # API 版本，留空时由应用调用守护进程 /version 自动协商，兼容 CentOS 旧版 Docker
    api-version: ''
    # 连接 / 响应超时（秒）；旧版 CentOS 低配机器可适当调大
    connection-timeout-seconds: 10
    response-timeout-seconds: 300

logging:
  level:
    root: INFO
    com.huluwa.console: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
