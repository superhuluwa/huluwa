server:
  port: 8089
  address: 0.0.0.0

spring:
  application:
    name: huluwa-console
  datasource:
    url: jdbc:sqlite:${huluwa.data-dir:./data}/huluwa.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      pool-name: huluwa-pool
      # WAL + busy_timeout：聊天异步 worker 落消息、订阅巡检读、WS 提交写三方并发时的防护
      connection-init-sql: PRAGMA foreign_keys = ON; PRAGMA busy_timeout = 5000; PRAGMA journal_mode = WAL
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
      encoding: UTF-8
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      static-locations: classpath:/static/
      cache:
        cachecontrol:
          no-cache: true

huluwa:
  data-dir: ./data
  token:
    # 留空则首次启动自动生成并持久化到数据库
    secret: ''
    expire-hours: 72
  frp:
    # frpc 容器名：状态查询、热加载与重启都作用于它（docker restart frpc）
    container: frpc
    # frpc 容器内的可执行文件与配置路径（在其内部执行 verify / reload）
    binary: frpc
    container-config-path: /etc/frp/frpc.ini
    # huluwa-console 容器内可见的配置文件路径：由宿主机 /root/frp 目录绑定挂载而来
    config-path: /app/frp/frpc.ini
    # 宿主机上的真实路径，仅用于界面展示
    host-path: /root/frp/frpc.ini
  docker:
    # 兼容历史配置；当前使用 docker-java SDK 直连守护进程，不再调用 docker CLI
    binary: ''
    # 守护进程地址：留空则回退 DOCKER_HOST 环境变量 / 系统默认 socket。
    # compose 部署已注入 DOCKER_HOST=unix:///var/run/docker.sock；
    # 远程可填 tcp://host:2375（或 2376 + TLS）。
    host: ''
    # API 版本，留空时由应用调用守护进程 /version 自动协商，兼容 CentOS 旧版 Docker
    api-version: ''
    # 连接 / 响应超时（秒）；旧版 CentOS 低配机器可适当调大
    connection-timeout-seconds: 10
    response-timeout-seconds: 300

logging:
  level:
    root: INFO
    com.huluwa.console: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"