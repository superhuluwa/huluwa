// 红果 TV 原生版的发布元数据：版本号与 Release 签名。
// 与 android.init.gradle 分开，避免改变葫芦娃和 TerminalBuddy 已有的构建行为。
// core 模块声明的 JDK 17 工具链由镜像预装的 openjdk-17 提供，Gradle 自动检测即可，
// 因此不再改写工具链，产物字节码目标与官方发布保持一致。
allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.versionCode = Integer.parseInt(System.getenv('HONGGUOTV_VERSION_CODE'))
            def versionName = System.getenv('HONGGUOTV_VERSION_NAME')
            if (versionName) android.defaultConfig.versionName = versionName
            // 源码里的 signingConfigs.delivery 从 HONGGUOTV_* 读取，这里再显式覆盖一次，
            // 保证旧提交或本地残留配置都不会绕过签名卷。
            def signing = android.signingConfigs.findByName('delivery') ?: android.signingConfigs.create('delivery')
            signing.storeFile = new File(System.getenv('HONGGUOTV_KEYSTORE'))
            signing.storePassword = System.getenv('HONGGUOTV_STORE_PASSWORD')
            signing.keyAlias = System.getenv('HONGGUOTV_KEY_ALIAS')
            signing.keyPassword = System.getenv('HONGGUOTV_KEY_PASSWORD')
            android.buildTypes.getByName('release').signingConfig = signing
        }
    }
}
