name: huluwa-debian-builder
services:
  android-builder-debian:
    image: huluwa-android-builder:debian
    container_name: huluwa-android-builder-debian
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python3", "/opt/builder/agent.py", "--config", "/run/secrets/android-builder-config"]
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    user: "10001:10001"
    cpus: "${HULUWA_ANDROID_CPUS:-4}"
    mem_limit: ${HULUWA_ANDROID_MEMORY:-5g}
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python3", "-c", "import json,time; c=json.load(open('/run/secrets/android-builder-config')); s=json.load(open(c['dataDirectory']+'/worker.json')); assert time.time()-s['heartbeat'] < 20"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3
    environment:
      HULUWA_ANDROID_PLATFORM: debian
      HULUWA_ANDROID_GRADLE_WORKERS: ${HULUWA_ANDROID_GRADLE_WORKERS:-4}
      HULUWA_ANDROID_GRADLE_JVM_ARGS: "${HULUWA_ANDROID_GRADLE_JVM_ARGS:--Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8}"
    # 显式设置上游 DNS，避免开机时 DHCP 尚未写入宿主机解析配置。
    dns:
      - 223.5.5.5
      - 119.29.29.29
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - android-builder-config
    volumes:
      - debian-build-data:/build-data
      - debian-workspace:/workspace
      - android-signing:/signing:ro
      - android-credentials:/credentials:ro

secrets:
  android-builder-config:
    file: ${HULUWA_ANDROID_AGENT_CONFIG:-../data/debian-builder/config.json}

volumes:
  debian-build-data:
    name: huluwa-android-debian-data
  debian-workspace:
    name: huluwa-android-debian-workspace
  android-signing:
    external: true
    name: huluwa-android-signing
  android-credentials:
    external: true
    name: huluwa-android-credentials
